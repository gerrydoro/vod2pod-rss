# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# rust-clippy is a tool that runs a bunch of lints to catch common
# mistakes in your Rust code and help improve your Rust code.
# More details at https://github.com/rust-lang/rust-clippy
# and https://rust-lang.github.io/rust-clippy/

name: clippy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-clippy-analyze:
    name: cargo clippy
    runs-on: [ self-hosted, nixos, vod2pod ]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install required cargo
        run: |
          nix develop --command cargo install clippy-sarif sarif-fmt
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run rust-clippy
        run: |
          nix develop --command bash -c '
            cargo clippy --all-features --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt || true
            # Ensure SARIF file exists and is valid even if clippy-sarif fails
            if [ ! -s rust-clippy-results.sarif ] || ! jq empty rust-clippy-results.sarif 2>/dev/null; then
              echo "{\"version\":\"2.1.0\",\"$schema\":\"https://json.schemastore.org/sarif-2.1.0.json\",\"runs\":[{\"tool\":{\"driver\":{\"name\":\"clippy\",\"informationUri\":\"https://github.com/rust-lang/rust-clippy\",\"rules\":[]}},\"results\":[]}]}" > rust-clippy-results.sarif
            fi
          '
        continue-on-error: true
        working-directory: ${{ github.workspace }}

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
