# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: [self-hosted, nixos, vod2pod]
    steps:
      - uses: actions/checkout@v6

      - name: Build and run all flake checks (test, clippy, format, doctest)
        run: nix flake check -L
