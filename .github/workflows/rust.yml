name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  YT_API_KEY: ${{ secrets.YT_API_KEY }}
  TWITCH_SECRET: ${{ secrets.TWITCH_SECRET }}
  TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}

jobs:
  test:
    runs-on: [self-hosted, nixos, vod2pod]
    steps:
      - uses: actions/checkout@v7

      - name: Start Redis server
        run: redis-server --daemonize yes

      - name: Check for API secrets
        id: secret-check
        shell: bash
        run: |
          if [ -n "${{ secrets.TWITCH_CLIENT_ID }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Run all tests (with API secrets)
        run: nix develop -c cargo test --verbose
        if: steps.secret-check.outputs.has_secrets == 'true'

      - name: Run tests (skip API-dependent tests)
        run: nix develop -c cargo test --verbose -- --skip requires_api_key
        if: steps.secret-check.outputs.has_secrets == 'false'
