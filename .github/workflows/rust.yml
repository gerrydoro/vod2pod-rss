name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  YT_API_KEY: ${{ secrets.YT_API_KEY }}
  TWITCH_SECRET: ${{ secrets.TWITCH_SECRET }}
  TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}

jobs:
  build-and-test:
    permissions:
      contents: read
    runs-on: [ self-hosted, nixos, vod2pod ]
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: |
          # Ensure we have the necessary environment for NixOS
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          echo "Using NixOS environment"
        shell: bash
      - name: Build
        run: nix develop -c cargo build --verbose
        shell: bash
      - name: Start Redis server
        run: |
          nix shell nixpkgs#redis -c redis-server --daemonize yes
        shell: bash
      - name: Run tests with secrets (if available)
        run: nix develop -c cargo test --verbose
        shell: bash
        if: ${{ secrets.TWITCH_CLIENT_ID != '' }}
      - name: Run tests without secrets (fallback)
        run: nix develop -c cargo test --verbose -- --skip requires_api_key
        shell: bash
        if: ${{ secrets.TWITCH_CLIENT_ID == '' }}
