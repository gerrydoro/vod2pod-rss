name: stable image
on:
  push:
    branches: [ stable ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency: ${{ github.head_ref || github.ref_name }}

env:
  # Opt into Node.js 24 for GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cargo_version_bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bump patch version
        run: |
          # Get the current version
          VERSION=$(grep -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml)
          # Bump the minor version
          NEW_VERSION=$(echo $VERSION | awk -F "." '{print $1"."$2"."($3+1)}')
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          # Replace the old version with the new version
          sed -i "s/^version = \"$VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml
        shell: bash
      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git tag -a v$VERSION -m "version $VERSION"
          git commit -a -m "Bump patch version to $NEW_VERSION"
          git push origin HEAD --follow-tags
          git fetch --unshallow
          git checkout main
          git merge stable
          git push origin HEAD --follow-tags
          git checkout stable

  push_to_ghcr_amd64:
      needs: cargo_version_bump
      runs-on: ubuntu-latest
      steps:
        - name: checkout repo
          uses: actions/checkout@v6
        - name: Bump patch version
          run: |
            # Get the current version
            VERSION=$(grep -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml)
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
        - name: remove dev deps and version (for cache purposes)
          run: |
            sh .github/workflows/remove_dev_deps_and_version.sh stable
          shell: bash
        - name: Build with Buildah
          uses: redhat-actions/buildah-build@v2
          with:
            image: vod2pod-rss
            tags: ${{ env.VERSION }}-amd64
            context: ./
            dockerfiles: ./Dockerfile
            platforms: linux/amd64
            extra-args: --cache-from=type=gha,scope=main-amd64 --cache-to=type=gha,mode=max,scope=main-amd64
        - name: Push to GHCR
          uses: redhat-actions/push-to-registry@v2
          with:
            image: vod2pod-rss
            tags: ${{ env.VERSION }}-amd64
            registry: ghcr.io/${{ github.repository_owner }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
  push_to_ghcr_arm64:
      needs: cargo_version_bump
      runs-on: ubuntu-latest
      steps:
        - name: checkout repo
          uses: actions/checkout@v6
        - name: Bump patch version
          run: |
            # Get the current version
            VERSION=$(grep -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml)
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
        - name: remove dev deps and version (for cache purposes)
          run: |
            sh .github/workflows/remove_dev_deps_and_version.sh stable
          shell: bash
        - name: Build with Buildah
          uses: redhat-actions/buildah-build@v2
          with:
            image: vod2pod-rss
            tags: ${{ env.VERSION }}-arm64
            context: ./
            dockerfiles: ./Dockerfile
            platforms: linux/arm64
            extra-args: --cache-from=type=gha,scope=main-arm64 --cache-to=type=gha,mode=max,scope=main-arm64
        - name: Push to GHCR
          uses: redhat-actions/push-to-registry@v2
          with:
            image: vod2pod-rss
            tags: ${{ env.VERSION }}-arm64
            registry: ghcr.io/${{ github.repository_owner }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
  push_to_ghcr_arm_v7:
      needs: cargo_version_bump
      runs-on: ubuntu-latest
      steps:
        - name: Set Swap Space
          uses: pierotofy/set-swap-space@v1.0
          with:
            swap-size-gb: 10
        - name: checkout repo
          uses: actions/checkout@v6
        - name: get version
          run: |
            # Get the current version
            VERSION=$(grep -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml)
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
        - name: remove dev deps and version (for cache purposes)
          run: |
            sh .github/workflows/remove_dev_deps_and_version.sh stable
          shell: bash
        - name: Build with Buildah
          uses: redhat-actions/buildah-build@v2
          with:
            image: vod2pod-rss
            tags: ${{ env.VERSION }}-armv7
            context: ./
            dockerfiles: ./Dockerfile
            platforms: linux/arm/v7
            extra-args: --cache-from=type=gha,scope=main-armv7 --cache-to=type=gha,mode=max,scope=main-armv7
        - name: Push to GHCR
          uses: redhat-actions/push-to-registry@v2
          with:
            image: vod2pod-rss
            tags: ${{ env.VERSION }}-armv7
            registry: ghcr.io/${{ github.repository_owner }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
  merge_tags:
      needs: [push_to_ghcr_arm64, push_to_ghcr_arm_v7, push_to_ghcr_amd64]
      runs-on: ubuntu-latest
      steps:
        - name: checkout repo
          uses: actions/checkout@v6
        - name: get version
          run: |
            # Get the current version
            VERSION=$(grep -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml)
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
        - name: Login to GHCR with Podman
          uses: redhat-actions/podman-login@v1
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Create manifest for latest
          run: |
            podman manifest create vod2pod-rss:latest
            podman manifest add vod2pod-rss:latest ghcr.io/${{ github.repository_owner }}/vod2pod-rss:${{ env.VERSION }}-amd64
            podman manifest add vod2pod-rss:latest ghcr.io/${{ github.repository_owner }}/vod2pod-rss:${{ env.VERSION }}-arm64
            podman manifest add vod2pod-rss:latest ghcr.io/${{ github.repository_owner }}/vod2pod-rss:${{ env.VERSION }}-armv7
            podman manifest push vod2pod-rss:latest ghcr.io/${{ github.repository_owner }}/vod2pod-rss:latest
        - name: Create manifest for version
          run: |
            podman manifest create vod2pod-rss:${{ env.VERSION }}
            podman manifest add vod2pod-rss:${{ env.VERSION }} ghcr.io/${{ github.repository_owner }}/vod2pod-rss:${{ env.VERSION }}-amd64
            podman manifest add vod2pod-rss:${{ env.VERSION }} ghcr.io/${{ github.repository_owner }}/vod2pod-rss:${{ env.VERSION }}-arm64
            podman manifest add vod2pod-rss:${{ env.VERSION }} ghcr.io/${{ github.repository_owner }}/vod2pod-rss:${{ env.VERSION }}-armv7
            podman manifest push vod2pod-rss:${{ env.VERSION }} ghcr.io/${{ github.repository_owner }}/vod2pod-rss:${{ env.VERSION }}
