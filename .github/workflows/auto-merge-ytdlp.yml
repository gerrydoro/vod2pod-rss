name: Auto-merge yt-dlp updates

on:
  pull_request:
    branches:
      - main
    paths:
      - "requirements.txt"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: [self-hosted, nixos, vod2pod]
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check if yt-dlp update
        id: check
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -q "requirements.txt"; then
            if git diff ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} -- requirements.txt | grep -q "yt-dlp"; then
              echo "is_ytdlp=true" >> $GITHUB_OUTPUT
              echo "Detected yt-dlp update"
            fi
          fi

      - name: Validate yt-dlp version
        if: steps.check.outputs.is_ytdlp == 'true'
        run: |
          nix shell nixpkgs#yt-dlp -c yt-dlp --version
          echo "yt-dlp version validated"

      - name: Enable auto-merge for yt-dlp
        if: steps.check.outputs.is_ytdlp == 'true'
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: steps.check.outputs.is_ytdlp == 'true'
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "Auto-merge enabled for yt-dlp update. PR will be merged automatically if CI passes."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
