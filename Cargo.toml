[package]
authors = ["vod2pod-rss <noreply@vod2pod-rss.dev>"]
edition = "2021"
name = "vod2pod-rss"
version = "1.2.7"

[lib]
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
actix-rt = "=2.11.0"
google-youtube3 = { version = "=7.0.0", default-features = false, features = ["aws-lc-rs"] }
google-apis-common = "=8.0.0"
hyper-util = "=0.1.20"
actix-web = "=4.14.0"
async-trait = "=0.1.89"
url = { version="=2.5.8", features = ["serde"]}
futures = "=0.3.32"
log = "=0.4.30"
regex = "=1.12.3"
reqwest = { version = "=0.13.4", features = ["json", "form", "query", "native-tls"] }
serde = "=1.0.228"
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["macros", "process"]}
uuid = { version= "=1.23.2", features = ["v4", "serde"]}
genawaiter = {version = "=0.99", features = ["futures03"] }
openssl = { version = "*", features = ["vendored"] }                                          #this is here just to make cross-compiling work during github actions
rss = { version = "=2.0", features = ["serde"] }
eyre = "=0.6"
simple_logger = "=5.2"
redis = { version = "=1.2", features = ["tokio-comp"] }
mime = "=0.3.17"
cached = { version = "=1.1.0", features = ["redis_tokio"] }
lazy_static = "=1.5.0"
urlencoding = "=2.1.3"
iso8601-duration = "=0.2.0"
chrono = "=0.4.44"
feed-rs = "=2.3.1"

[dev-dependencies]
temp-env ={ version = "=0.3.6", features = ["async_closure"] }
env_logger = "*"
test-log = "0.2.21"
